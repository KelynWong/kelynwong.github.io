<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 383" xmlns="http://www.w3.org/2000/svg">
  <style>.m{font-family:'JetBrains Mono','Courier New',monospace}</style>
  <rect width="680" height="383" fill="#0d0d0d"/>
  <defs><pattern id="g2" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#1a1a1a" stroke-width="0.5"/></pattern></defs>
  <rect width="680" height="383" fill="url(#g2)"/>
  <rect x="0" y="0" width="680" height="36" fill="#141414"/>
  <rect x="0" y="35" width="680" height="1" fill="#2a2a2a"/>
  <circle cx="72" cy="18" r="5" fill="#C4836A"/><circle cx="90" cy="18" r="5" fill="#C8C87A"/><circle cx="108" cy="18" r="5" fill="#8BB87A"/>
  <text x="136" y="23" class="m" font-size="11" fill="#3a3a3a">keypad_access.py</text>
  <line x1="52" y1="36" x2="52" y2="383" stroke="#1e1e1e" stroke-width="1"/>
  <text x="64" y="74" class="m" font-size="11" fill="#3a3a3a">// project</text>
  <text x="64" y="98" class="m" font-size="20" font-weight="500" fill="#ffffff">Keypad Door</text>
  <text x="64" y="122" class="m" font-size="20" font-weight="500" fill="#C4836A">Access System</text>
  <!-- Keypad grid -->
  <rect x="130" y="148" width="140" height="170" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <!-- keypad buttons 3x4 -->
  <rect x="144" y="162" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="159" y="178" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">1</text>
  <rect x="182" y="162" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="197" y="178" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">2</text>
  <rect x="220" y="162" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="235" y="178" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">3</text>
  <rect x="144" y="194" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="159" y="210" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">4</text>
  <rect x="182" y="194" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="197" y="210" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">5</text>
  <rect x="220" y="194" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="235" y="210" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">6</text>
  <rect x="144" y="226" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="159" y="242" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">7</text>
  <rect x="182" y="226" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="197" y="242" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">8</text>
  <rect x="220" y="226" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="235" y="242" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">9</text>
  <rect x="144" y="258" width="30" height="24" rx="3" fill="#1e2a1e" stroke="#4a7a4a" stroke-width="0.8"/><text x="159" y="274" class="m" font-size="9" fill="#8BB87A" text-anchor="middle">*</text>
  <rect x="182" y="258" width="30" height="24" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="0.8"/><text x="197" y="274" class="m" font-size="11" fill="#8BB87A" text-anchor="middle">0</text>
  <rect x="220" y="258" width="30" height="24" rx="3" fill="#2a1a1a" stroke="#7a3a3a" stroke-width="0.8"/><text x="235" y="274" class="m" font-size="9" fill="#C4836A" text-anchor="middle">#</text>
  <!-- LCD above keypad -->
  <rect x="130" y="110" width="140" height="32" rx="3" fill="#0a1a12" stroke="#8BB87A" stroke-width="0.8"/>
  <rect x="134" y="114" width="132" height="24" rx="2" fill="#0d2b1a"/>
  <text x="200" y="130" class="m" font-size="9" fill="#8BB87A" text-anchor="middle">ENTER PASSCODE: ****</text>
  <!-- Pi board -->
  <rect x="360" y="80" width="160" height="110" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="368" y="88" width="144" height="94" rx="3" fill="#0a1a1a"/>
  <rect x="382" y="106" width="60" height="42" rx="3" fill="#0f2020" stroke="#5BAADC" stroke-width="0.8"/>
  <text x="412" y="124" class="m" font-size="9" fill="#5BAADC" text-anchor="middle">BCM2711</text>
  <text x="412" y="136" class="m" font-size="9" fill="#2a5a5a" text-anchor="middle">RPi 4</text>
  <rect x="452" y="100" width="18" height="8" rx="1" fill="#333"/><rect x="452" y="112" width="18" height="8" rx="1" fill="#333"/>
  <text x="440" y="170" class="m" font-size="9" fill="#3a3a3a" text-anchor="middle">Raspberry Pi</text>
  <!-- Camera module -->
  <rect x="360" y="210" width="70" height="56" rx="4" fill="#141414" stroke="#B87DB8" stroke-width="0.8"/>
  <circle cx="395" cy="232" r="14" fill="#0d0d18" stroke="#B87DB8" stroke-width="0.8"/>
  <circle cx="395" cy="232" r="8" fill="#1a1a2a"/>
  <circle cx="395" cy="232" r="3" fill="#B87DB8" opacity="0.6"/>
  <text x="395" y="256" class="m" font-size="9" fill="#B87DB8" text-anchor="middle">camera</text>
  <!-- Streamlit block -->
  <rect x="460" y="210" width="80" height="36" rx="4" fill="#141414" stroke="#C4836A" stroke-width="0.8"/>
  <text x="500" y="225" class="m" font-size="10" fill="#C4836A" text-anchor="middle">Streamlit</text>
  <text x="500" y="239" class="m" font-size="9" fill="#5a3a2a" text-anchor="middle">dashboard</text>
  <!-- ThingSpeak -->
  <rect x="460" y="260" width="80" height="36" rx="10" fill="#141414" stroke="#8BB87A" stroke-width="0.8"/>
  <text x="500" y="275" class="m" font-size="10" fill="#8BB87A" text-anchor="middle">ThingSpeak</text>
  <text x="500" y="289" class="m" font-size="9" fill="#3a5a3a" text-anchor="middle">alerts</text>
  <!-- wires -->
  <line x1="430" y1="135" x2="430" y2="210" stroke="#2a3a2a" stroke-width="0.7" stroke-dasharray="3 2"/>
  <line x1="440" y1="190" x2="460" y2="228" stroke="#2a2a3a" stroke-width="0.7" stroke-dasharray="3 2"/>
  <!-- door -->
  <rect x="548" y="60" width="28" height="295" rx="2" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="550" y="62" width="24" height="291" rx="1" fill="#111"/>
  <circle cx="553" cy="210" r="4" fill="#C4836A" opacity="0.7"/>
  <rect x="571" y="80" width="4" height="8" rx="1" fill="#333"/><rect x="571" y="330" width="4" height="8" rx="1" fill="#333"/>
  <!-- code -->
  <text x="64" y="318" class="m" font-size="10" fill="#2a3a2a">if passcode == stored_code:</text>
  <text x="64" y="334" class="m" font-size="10" fill="#4A72B0">    servo</text>
  <text x="103" y="334" class="m" font-size="10" fill="#d4d4d4">.unlock()</text>
  <text x="64" y="350" class="m" font-size="10" fill="#4A72B0">    client</text>
  <text x="111" y="350" class="m" font-size="10" fill="#d4d4d4">.publish(</text>
  <text x="166" y="350" class="m" font-size="10" fill="#C8C87A">"access"</text>
  <text x="212" y="350" class="m" font-size="10" fill="#d4d4d4">)</text>
  <text x="64" y="366" class="m" font-size="10" fill="#2a3a2a">else: trigger_alert()</text>
</svg>

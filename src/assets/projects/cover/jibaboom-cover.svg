<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 383" xmlns="http://www.w3.org/2000/svg">
  <style>.m{font-family:'JetBrains Mono','Courier New',monospace}</style>
  <rect width="680" height="383" fill="#0d0d0d"/>
  <defs><pattern id="g6" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#1a1a1a" stroke-width="0.5"/></pattern></defs>
  <rect width="680" height="383" fill="url(#g6)"/>
  <rect x="0" y="0" width="680" height="36" fill="#141414"/>
  <rect x="0" y="35" width="680" height="1" fill="#2a2a2a"/>
  <circle cx="72" cy="18" r="5" fill="#C4836A"/><circle cx="90" cy="18" r="5" fill="#C8C87A"/><circle cx="108" cy="18" r="5" fill="#8BB87A"/>
  <text x="136" y="23" class="m" font-size="11" fill="#3a3a3a">jibaboom_api.js</text>
  <line x1="52" y1="36" x2="52" y2="383" stroke="#1e1e1e" stroke-width="1"/>
  <text x="64" y="74" class="m" font-size="11" fill="#3a3a3a">// project</text>
  <text x="64" y="98" class="m" font-size="20" font-weight="500" fill="#ffffff">JiBaBoom</text>
  <text x="64" y="122" class="m" font-size="20" font-weight="500" fill="#C8C87A">Full-Stack App</text>
  <!-- 3-layer architecture diagram -->
  <!-- Mobile client -->
  <rect x="80" y="152" width="80" height="52" rx="6" fill="#141414" stroke="#C8C87A" stroke-width="1"/>
  <rect x="88" y="160" width="64" height="36" rx="2" fill="#1a1a0a"/>
  <text x="120" y="175" class="m" font-size="9" fill="#C8C87A" text-anchor="middle">Mobile App</text>
  <text x="120" y="188" class="m" font-size="8" fill="#4a4a2a" text-anchor="middle">offline cache</text>
  <!-- browser client -->
  <rect x="80" y="222" width="80" height="52" rx="4" fill="#141414" stroke="#5BAADC" stroke-width="1"/>
  <rect x="86" y="228" width="68" height="40" rx="2" fill="#0a0f1a"/>
  <!-- browser header -->
  <rect x="86" y="228" width="68" height="10" rx="2" fill="#1a1a2a"/>
  <circle cx="92" cy="233" r="2" fill="#C4836A" opacity="0.7"/>
  <circle cx="99" cy="233" r="2" fill="#C8C87A" opacity="0.7"/>
  <circle cx="106" cy="233" r="2" fill="#8BB87A" opacity="0.7"/>
  <text x="120" y="250" class="m" font-size="9" fill="#5BAADC" text-anchor="middle">Browser</text>
  <text x="120" y="260" class="m" font-size="8" fill="#2a3a5a" text-anchor="middle">data viewer</text>
  <!-- arrows to API -->
  <line x1="160" y1="178" x2="230" y2="200" stroke="#2a3a2a" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="160" y1="248" x2="230" y2="230" stroke="#2a3a4a" stroke-width="0.8" stroke-dasharray="3 2"/>
  <!-- REST API middle -->
  <rect x="230" y="178" width="110" height="70" rx="6" fill="#141414" stroke="#8BB87A" stroke-width="1.2"/>
  <text x="285" y="200" class="m" font-size="10" fill="#8BB87A" text-anchor="middle">REST API</text>
  <text x="285" y="214" class="m" font-size="9" fill="#2a4a2a" text-anchor="middle">Node.js + Express</text>
  <!-- routes -->
  <text x="285" y="228" class="m" font-size="8" fill="#3a3a3a" text-anchor="middle">GET /data  POST /query</text>
  <!-- arrow to DB -->
  <line x1="340" y1="213" x2="400" y2="213" stroke="#333" stroke-width="0.8"/>
  <!-- PostgreSQL -->
  <rect x="400" y="178" width="110" height="70" rx="6" fill="#141414" stroke="#4A72B0" stroke-width="1"/>
  <!-- cylinder shape -->
  <ellipse cx="455" cy="198" rx="38" ry="10" fill="#1a1a2a" stroke="#4A72B0" stroke-width="0.8"/>
  <rect x="417" y="198" width="76" height="30" fill="#1a1a2a"/>
  <ellipse cx="455" cy="228" rx="38" ry="10" fill="#1a1a2a" stroke="#4A72B0" stroke-width="0.8"/>
  <text x="455" y="216" class="m" font-size="9" fill="#5BAADC" text-anchor="middle">PostgreSQL</text>
  <!-- code snippet -->
  <text x="64" y="310" class="m" font-size="10" fill="#2a3a2a">app.get(</text>
  <text x="112" y="310" class="m" font-size="10" fill="#C8C87A">'/api/data'</text>
  <text x="178" y="310" class="m" font-size="10" fill="#d4d4d4">, async (req, res) => {</text>
  <text x="74" y="326" class="m" font-size="10" fill="#4A72B0">  const</text>
  <text x="111" y="326" class="m" font-size="10" fill="#d4d4d4"> result = await </text>
  <text x="200" y="326" class="m" font-size="10" fill="#8BB87A">db</text>
  <text x="212" y="326" class="m" font-size="10" fill="#d4d4d4">.query(sql)</text>
  <text x="74" y="342" class="m" font-size="10" fill="#4A72B0">  res</text>
  <text x="93" y="342" class="m" font-size="10" fill="#d4d4d4">.json(result.rows)</text>
  <text x="64" y="358" class="m" font-size="10" fill="#d4d4d4">})</text>
</svg>

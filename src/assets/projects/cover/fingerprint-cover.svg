<svg width="100%" viewBox="0 0 680 383" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Fingerprint Door Access System — project cover</title>
  <desc>Dark terminal-aesthetic cover showing fingerprint scan UI with Arduino circuit elements and access granted status.</desc>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <rect width="680" height="383" fill="#0d0d0d"/>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e1e1e" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="383" fill="url(#grid)"/>

  <!-- Top terminal bar -->
  <rect x="0" y="0" width="680" height="36" fill="#141414"/>
  <rect x="0" y="35" width="680" height="1" fill="#2a2a2a"/>
  <circle cx="72" cy="18" r="5" fill="#C4836A"/>
  <circle cx="90" cy="18" r="5" fill="#C8C87A"/>
  <circle cx="108" cy="18" r="5" fill="#8BB87A"/>
  <text x="134" y="22" class="mono" font-size="11" fill="#3a3a3a">fingerprint_access.ino</text>

  <!-- Left vertical accent -->
  <line x1="52" y1="36" x2="52" y2="383" stroke="#2a2a2a" stroke-width="1"/>

  <!-- TITLE -->
  <text x="64" y="65" class="mono" font-size="11" fill="#3a3a3a">// project</text>
  <text x="64" y="89" class="mono" font-size="20" font-weight="500" fill="#ffffff">Fingerprint Door</text>
  <text x="64" y="113" class="mono" font-size="20" font-weight="500" fill="#5BAADC">Access System</text>

  <!-- FINGERPRINT SCAN UI -->
  <circle cx="175" cy="210" r="90" fill="none" stroke="#1e2a3a" stroke-width="1"/>
  <circle cx="175" cy="210" r="80" fill="none" stroke="#2a3a4a" stroke-width="0.8" stroke-dasharray="4 3"/>
  <circle cx="175" cy="210" r="68" fill="#0f1820"/>
  <circle cx="175" cy="210" r="68" fill="none" stroke="#5BAADC" stroke-width="1.5" stroke-dasharray="210 14"/>

  <!-- fingerprint ridges -->
  <path d="M200 177 C220 177 238 190 242 207 C246 224 238 242 222 250 C206 258 188 254 176 242 C164 230 162 212 170 199 C178 186 192 178 200 177" fill="none" stroke="#5BAADC" stroke-width="1.2" opacity="0.7"/>
  <path d="M200 185 C216 185 231 196 234 211 C237 226 230 240 217 247 C204 254 189 250 179 240 C169 230 168 215 175 203 C182 191 193 185 200 185" fill="none" stroke="#5BAADC" stroke-width="1" opacity="0.55"/>
  <path d="M200 193 C213 193 225 202 227 215 C229 228 223 239 212 245 C201 251 189 247 181 238 C173 229 173 217 179 206 C185 195 194 193 200 193" fill="none" stroke="#5BAADC" stroke-width="1" opacity="0.4"/>
  <path d="M200 201 C211 201 220 208 221 219 C222 230 217 238 208 243 C199 248 189 244 183 236 C177 228 177 218 183 210 C189 202 196 201 200 201" fill="none" stroke="#5BAADC" stroke-width="0.9" opacity="0.3"/>
  <path d="M200 209 C207 209 213 214 214 222 C215 230 211 236 204 239 C197 242 190 239 187 232 C184 225 185 218 190 213 C195 208 198 209 200 209" fill="none" stroke="#5BAADC" stroke-width="0.8" opacity="0.2"/>

  <!-- scan sweep line -->
  <rect x="132" y="215" width="136" height="2" fill="#5BAADC" opacity="0.5" rx="1"/>
  <circle cx="132" cy="216" r="3" fill="#5BAADC" opacity="0.4"/>
  <circle cx="268" cy="216" r="3" fill="#5BAADC" opacity="0.4"/>

  <!-- corner brackets -->
  <path d="M140 172 L140 187 M140 172 L155 172" fill="none" stroke="#5BAADC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M260 172 L260 187 M260 172 L245 172" fill="none" stroke="#5BAADC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M140 272 L140 257 M140 272 L155 272" fill="none" stroke="#5BAADC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M260 272 L260 257 M260 272 L245 272" fill="none" stroke="#5BAADC" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ACCESS GRANTED pill -->
  <rect x="140" y="305" width="120" height="22" rx="3" fill="#0f2a18" stroke="#8BB87A" stroke-width="1"/>
  <circle cx="155" cy="316" r="3" fill="#8BB87A"/>
  <text x="165" y="320" class="mono" font-size="10" fill="#8BB87A">ACCESS GRANTED</text>

  <!-- Arduino Uno -->
  <rect x="420" y="80" width="180" height="130" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="428" y="88" width="164" height="114" rx="4" fill="#0f1f0f" stroke="#2a2a2a" stroke-width="0.5"/>
  <rect x="476" y="118" width="68" height="54" rx="3" fill="#1a2a1a" stroke="#5E8A5E" stroke-width="0.8"/>
  <text x="510" y="141" class="mono" font-size="10" fill="#8BB87A" text-anchor="middle">ATMEGA</text>
  <text x="510" y="155" class="mono" font-size="10" fill="#8BB87A" text-anchor="middle">328P</text>
  <!-- pin rows top -->
  <rect x="434" y="84" width="8" height="6" rx="1" fill="#333"/>
  <rect x="448" y="84" width="8" height="6" rx="1" fill="#333"/>
  <rect x="462" y="84" width="8" height="6" rx="1" fill="#333"/>
  <rect x="476" y="84" width="8" height="6" rx="1" fill="#333"/>
  <rect x="490" y="84" width="8" height="6" rx="1" fill="#333"/>
  <rect x="504" y="84" width="8" height="6" rx="1" fill="#333"/>
  <!-- pin rows bottom -->
  <rect x="434" y="206" width="8" height="6" rx="1" fill="#333"/>
  <rect x="448" y="206" width="8" height="6" rx="1" fill="#333"/>
  <rect x="462" y="206" width="8" height="6" rx="1" fill="#333"/>
  <rect x="476" y="206" width="8" height="6" rx="1" fill="#333"/>
  <rect x="490" y="206" width="8" height="6" rx="1" fill="#333"/>
  <rect x="504" y="206" width="8" height="6" rx="1" fill="#333"/>
  <text x="510" y="228" class="mono" font-size="9" fill="#3a3a3a" text-anchor="middle">Arduino Uno</text>

  <!-- circuit traces -->
  <polyline points="420,148 396,148" fill="none" stroke="#2a3a2a" stroke-width="0.8"/>
  <polyline points="420,162 400,162 400,198 388,198" fill="none" stroke="#2a3a2a" stroke-width="0.8"/>
  <polyline points="420,176 395,176 395,246 388,246" fill="none" stroke="#2a2a3a" stroke-width="0.8"/>

  <!-- AS608 sensor -->
  <rect x="330" y="132" width="58" height="40" rx="4" fill="#141414" stroke="#4A72B0" stroke-width="1"/>
  <text x="359" y="150" class="mono" font-size="10" fill="#5BAADC" text-anchor="middle">AS608</text>
  <text x="359" y="164" class="mono" font-size="10" fill="#4A72B0" text-anchor="middle">sensor</text>

  <!-- LCD -->
  <rect x="330" y="232" width="60" height="30" rx="3" fill="#0a1a12" stroke="#8BB87A" stroke-width="0.8"/>
  <rect x="335" y="237" width="50" height="20" rx="2" fill="#0d2b1a"/>
  <text x="360" y="251" class="mono" font-size="9" fill="#8BB87A" text-anchor="middle">LCD 16×2</text>

  <!-- Servo -->
  <rect x="556" y="248" width="56" height="36" rx="3" fill="#1a1414" stroke="#C4836A" stroke-width="0.8"/>
  <text x="584" y="263" class="mono" font-size="10" fill="#C4836A" text-anchor="middle">SERVO</text>
  <text x="584" y="277" class="mono" font-size="9" fill="#7a4a3a" text-anchor="middle">SG90</text>
  <line x1="556" y1="262" x2="536" y2="162" stroke="#2a2a2a" stroke-width="0.6" stroke-dasharray="3 2"/>

  <!-- ThingSpeak -->
  <rect x="558" y="78" width="80" height="36" rx="10" fill="#141414" stroke="#8BB87A" stroke-width="0.8"/>
  <text x="598" y="93" class="mono" font-size="10" fill="#8BB87A" text-anchor="middle">ThingSpeak</text>
  <text x="598" y="107" class="mono" font-size="9" fill="#3a5a3a" text-anchor="middle">cloud log</text>
  <line x1="558" y1="96" x2="536" y2="148" stroke="#2a3a2a" stroke-width="0.7" stroke-dasharray="3 2"/>

  <!-- Twitter API -->
  <rect x="558" y="152" width="80" height="36" rx="4" fill="#141414" stroke="#5BAADC" stroke-width="0.8"/>
  <text x="598" y="167" class="mono" font-size="10" fill="#5BAADC" text-anchor="middle">Twitter API</text>
  <text x="598" y="181" class="mono" font-size="9" fill="#2a4a5a" text-anchor="middle">intruder alert</text>

  <!-- Buzzer -->
  <circle cx="390" cy="104" r="14" fill="#141414" stroke="#B87DB8" stroke-width="0.8"/>
  <text x="390" y="108" class="mono" font-size="10" fill="#B87DB8" text-anchor="middle">BZR</text>
  <line x1="390" y1="118" x2="390" y2="132" stroke="#2a2a3a" stroke-width="0.7"/>

  <!-- Door edge -->
  <rect x="636" y="60" width="28" height="295" rx="2" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="638" y="62" width="24" height="291" rx="1" fill="#111"/>
  <circle cx="641" cy="210" r="4" fill="#C4836A" opacity="0.7"/>
  <rect x="659" y="80" width="4" height="8" rx="1" fill="#333"/>
  <rect x="659" y="330" width="4" height="8" rx="1" fill="#333"/>

  <!-- Code snippet -->
  <text x="64" y="318" class="mono" font-size="10" fill="#2a3a2a">if (fingerprintID != 0) {</text>
  <text x="75" y="334" class="mono" font-size="10" fill="#4A72B0">  servo</text>
  <text x="105" y="334" class="mono" font-size="10" fill="#d4d4d4">.write(</text>
  <text x="145" y="334" class="mono" font-size="10" fill="#C8C87A">90</text>
  <text x="158" y="334" class="mono" font-size="10" fill="#d4d4d4">);</text>
  <text x="75" y="350" class="mono" font-size="10" fill="#4A72B0">  ThingSpeak</text>
  <text x="137" y="350" class="mono" font-size="10" fill="#d4d4d4">.log(</text>
  <text x="169" y="350" class="mono" font-size="10" fill="#C8C87A">"unlock"</text>
  <text x="215" y="350" class="mono" font-size="10" fill="#d4d4d4">);</text>
  <text x="64" y="366" class="mono" font-size="10" fill="#2a3a2a">}</text>

</svg>
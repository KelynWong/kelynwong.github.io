<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 383" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ROW — Right Or Wrong community app cover</title>
  <style>.mono{font-family:'JetBrains Mono','Courier New',monospace}</style>

  <rect width="680" height="383" fill="#0d0d0d"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">

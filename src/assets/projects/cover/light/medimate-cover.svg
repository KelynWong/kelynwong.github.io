  <rect x="480" y="188" width="68" height="24" rx="3" fill="#141414" stroke="#C8C87A" stroke-width="0.6"/>
  <text x="514" y="204" class="m" font-size="9" fill="#C8C87A" text-anchor="middle">ViewModel</text>
  <line x1="514" y1="212" x2="514" y2="228" stroke="#333" stroke-width="0.7"/>
  <rect x="480" y="228" width="68" height="24" rx="3" fill="#141414" stroke="#8BB87A" stroke-width="0.6"/>
  <text x="514" y="244" class="m" font-size="9" fill="#8BB87A" text-anchor="middle">Model</text>
  <text x="514" y="272" class="m" font-size="9" fill="#3a3a3a" text-anchor="middle">MVVM</text>
  <!-- code -->
  <text x="400" y="322" class="m" font-size="10" fill="#2a3a2a">@Composable fun MedCard(med: Med) {</text>
  <text x="410" y="338" class="m" font-size="10" fill="#4A72B0">  val</text>
  <text x="435" y="338" class="m" font-size="10" fill="#d4d4d4"> status by </text>
  <text x="495" y="338" class="m" font-size="10" fill="#8BB87A">viewModel</text>
  <text x="548" y="338" class="m" font-size="10" fill="#d4d4d4">.state</text>
  <text x="410" y="354" class="m" font-size="10" fill="#d4d4d4">  MedicationRow(med, status, onTaken)</text>

  <text x="64" y="318" class="mono" font-size="10" fill="#2a3a2a">class</text>
  <text x="102" y="318" class="mono" font-size="10" fill="#C8C87A"> QuizApp</text>
  <text x="148" y="318" class="mono" font-size="10" fill="#d4d4d4"> {</text>
  <text x="74" y="334" class="mono" font-size="10" fill="#4A72B0">  constructor</text>
  <text x="143" y="334" class="mono" font-size="10" fill="#d4d4d4">() { this.score = </text>
  <text x="251" y="334" class="mono" font-size="10" fill="#C8C87A">0</text>
  <text x="258" y="334" class="mono" font-size="10" fill="#d4d4d4"> }</text>
  <text x="74" y="350" class="mono" font-size="10" fill="#8BB87A">  submitAnswer</text>
  <text x="148" y="350" class="mono" font-size="10" fill="#d4d4d4">(mcq, selected) {</text>
  <text x="85" y="366" class="mono" font-size="10" fill="#4A72B0">    if</text>
  <text x="100" y="366" class="mono" font-size="10" fill="#d4d4d4"> (mcq.isCorrect(selected)) this.score++</text>

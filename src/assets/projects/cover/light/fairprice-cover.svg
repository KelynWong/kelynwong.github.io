  <text x="104" y="318" class="mono" font-size="10" fill="#2f6faa"> p.product_name</text>
  <text x="76" y="334" class="mono" font-size="10" fill="#5b8d67"> CASE</text>
  <text x="106" y="334" class="mono" font-size="10" fill="#2d3a45"> d.disc_type</text>
  <text x="64" y="350" class="mono" font-size="10" fill="#2d3a45">    </text>
  <text x="76" y="350" class="mono" font-size="10" fill="#5b8d67">WHEN</text>
  <text x="106" y="350" class="mono" font-size="10" fill="#9c8d4f"> 'direct'</text>

  <circle cx="580" cy="96" r="14" fill="none" stroke="#B87DB8" stroke-width="0.8"/>
  <circle cx="580" cy="96" r="8" fill="#0d0814"/>
  <circle cx="580" cy="96" r="4" fill="#1a0a1a"/>
  <circle cx="577" cy="93" r="1.5" fill="#B87DB8" opacity="0.5"/>

  <!-- phone icon -->
  <rect x="445" y="68" width="36" height="56" rx="5" fill="#0d1a1a" stroke="#5BAADC" stroke-width="0.8"/>
  <rect x="448" y="72" width="30" height="44" rx="2" fill="#0a1212"/>

  <text x="370" y="244" class="mono" font-size="9" fill="#C4836A" text-anchor="middle">Seller Portal</text>
  <text x="296" y="262" class="mono" font-size="8" fill="#6a4a2a">Create listing</text>
  <text x="296" y="273" class="mono" font-size="8" fill="#6a4a2a">Manage inventory</text>
  <text x="296" y="284" class="mono" font-size="8" fill="#6a4a2a">Track transactions</text>

  <rect x="462" y="232" width="174" height="64" rx="4" fill="#141414" stroke="#5BAADC" stroke-width="0.8"/>
  <rect x="462" y="232" width="174" height="18" rx="4" fill="#0a1a2a"/>
  <text x="549" y="244" class="mono" font-size="9" fill="#5BAADC" text-anchor="middle">Buyer Portal</text>
  <text x="468" y="262" class="mono" font-size="8" fill="#2a4a6a">Browse listings</text>
  <text x="468" y="273" class="mono" font-size="8" fill="#2a4a6a">Search &amp; filter</text>
  <text x="468" y="284" class="mono" font-size="8" fill="#2a4a6a">Purchase &amp; history</text>

  <!-- code snippet -->
  <text x="64" y="320" class="mono" font-size="10" fill="#2a3a2a">router.get(</text>
  <text x="130" y="320" class="mono" font-size="10" fill="#C8C87A">'/listings'</text>
  <text x="197" y="320" class="mono" font-size="10" fill="#d4d4d4">, async (req, res) => {</text>
  <text x="74" y="336" class="mono" font-size="10" fill="#4A72B0">  const</text>
  <text x="111" y="336" class="mono" font-size="10" fill="#d4d4d4"> items = await </text>
  <text x="195" y="336" class="mono" font-size="10" fill="#8BB87A">db</text>
  <text x="207" y="336" class="mono" font-size="10" fill="#d4d4d4">.query(sql)</text>
  <text x="74" y="352" class="mono" font-size="10" fill="#4A72B0">  res</text>
  <text x="92" y="352" class="mono" font-size="10" fill="#d4d4d4">.json(items)</text>
  <text x="64" y="368" class="mono" font-size="10" fill="#d4d4d4">})</text>

  <text x="414" y="154" class="mono" font-size="8" fill="#5BAADC">$480</text>
  <text x="414" y="164" class="mono" font-size="7" fill="#555">Like new</text>
  <rect x="414" y="168" width="36" height="10" rx="2" fill="#0f1820" stroke="#5BAADC" stroke-width="0.5"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 383" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ATM Machine — project cover</title>
  <desc>Dark terminal-aesthetic cover for an ATM Machine Java console simulator with file-based persistence.</desc>
  <style>.mono{font-family:'JetBrains Mono','Courier New',monospace}</style>

  <rect width="680" height="383" fill="#0d0d0d"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e1e1e" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="383" fill="url(#grid)"/>

  <rect x="0" y="0" width="680" height="36" fill="#141414"/>
  <rect x="0" y="35" width="680" height="1" fill="#2a2a2a"/>
  <circle cx="72" cy="18" r="5" fill="#C4836A"/>
  <circle cx="90" cy="18" r="5" fill="#C8C87A"/>
  <circle cx="108" cy="18" r="5" fill="#8BB87A"/>
  <text x="134" y="22" class="mono" font-size="11" fill="#3a3a3a">ATMMachine.java</text>
  <line x1="52" y1="36" x2="52" y2="383" stroke="#2a2a2a" stroke-width="1"/>

  <text x="64" y="65" class="mono" font-size="11" fill="#3a3a3a">// project</text>
  <text x="64" y="89" class="mono" font-size="20" font-weight="500" fill="#ffffff">ATM Machine</text>
  <text x="64" y="113" class="mono" font-size="20" font-weight="500" fill="#C8C87A">Java Simulator</text>

  <!-- glow rings -->
  <circle cx="175" cy="220" r="72" fill="none" stroke="#2a2a0a" stroke-width="18"/>
  <circle cx="175" cy="220" r="56" fill="none" stroke="#1a1a08" stroke-width="10"/>

  <!-- ATM front panel -->
  <rect x="128" y="155" width="94" height="138" rx="6" fill="#141414" stroke="#C8C87A" stroke-width="1.2"/>
  <!-- screen -->
  <rect x="136" y="163" width="78" height="46" rx="3" fill="#0a1a0a" stroke="#8BB87A" stroke-width="0.8"/>
  <!-- screen text lines -->
  <text x="175" y="179" class="mono" font-size="7" fill="#8BB87A" text-anchor="middle">WELCOME</text>
  <text x="175" y="193" class="mono" font-size="6" fill="#3a5a3a" text-anchor="middle">Insert card or</text>
  <text x="175" y="200" class="mono" font-size="6" fill="#3a5a3a" text-anchor="middle">enter account ID</text>
  <!-- screen scanline -->
  <line x1="136" y1="170" x2="214" y2="170" stroke="#8BB87A" stroke-width="0.4" opacity="0.2"/>
  <line x1="136" y1="184" x2="214" y2="184" stroke="#8BB87A" stroke-width="0.4" opacity="0.2"/>
  <!-- card slot -->
  <rect x="148" y="215" width="54" height="6" rx="1" fill="#0d0d0d" stroke="#C8C87A" stroke-width="0.6"/>
  <text x="175" y="228" class="mono" font-size="6" fill="#3a3a3a" text-anchor="middle">CARD SLOT</text>
  <!-- keypad 3×4 -->
  <rect x="138" y="237" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="143" y="243" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">1</text>
  <rect x="152" y="237" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="157" y="243" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">2</text>
  <rect x="166" y="237" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="171" y="243" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">3</text>
  <rect x="138" y="249" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="143" y="255" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">4</text>
  <rect x="152" y="249" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="157" y="255" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">5</text>
  <rect x="166" y="249" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="171" y="255" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">6</text>
  <rect x="138" y="261" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="143" y="267" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">7</text>
  <rect x="152" y="261" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="157" y="267" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">8</text>
  <rect x="166" y="261" width="10" height="8" rx="1" fill="#1a1a1a" stroke="#C8C87A" stroke-width="0.5"/>
  <text x="171" y="267" class="mono" font-size="5" fill="#C8C87A" text-anchor="middle">9</text>
  <!-- confirm / cancel buttons -->
  <rect x="180" y="237" width="32" height="14" rx="2" fill="#0f2a18" stroke="#8BB87A" stroke-width="0.6"/>
  <text x="196" y="245" class="mono" font-size="5" fill="#8BB87A" text-anchor="middle">CONFIRM</text>
  <rect x="180" y="255" width="32" height="14" rx="2" fill="#2a0f0a" stroke="#C4836A" stroke-width="0.6"/>
  <text x="196" y="263" class="mono" font-size="5" fill="#C4836A" text-anchor="middle">CANCEL</text>
  <!-- cash slot -->
  <rect x="148" y="275" width="54" height="5" rx="1" fill="#0d0d0d" stroke="#C8C87A" stroke-width="0.6"/>
  <text x="175" y="288" class="mono" font-size="6" fill="#3a3a3a" text-anchor="middle">CASH DISPENSER</text>

  <!-- RIGHT: console terminal mockup -->
  <rect x="330" y="52" width="300" height="226" rx="4" fill="#080f08" stroke="#1a2a1a" stroke-width="1"/>
  <rect x="330" y="52" width="300" height="20" rx="4" fill="#141414"/>
  <circle cx="343" cy="62" r="3" fill="#C4836A" opacity="0.7"/>
  <circle cx="356" cy="62" r="3" fill="#C8C87A" opacity="0.7"/>
  <circle cx="368" cy="62" r="3" fill="#8BB87A" opacity="0.7"/>
  <text x="463" y="66" class="mono" font-size="8" fill="#3a3a3a" text-anchor="middle">ATMMachine.java — Console</text>
  <!-- console output -->
  <text x="338" y="86" class="mono" font-size="9" fill="#3a5a3a">$ java ATMMachine</text>
  <text x="338" y="100" class="mono" font-size="9" fill="#8BB87A">============================</text>
  <text x="338" y="114" class="mono" font-size="9" fill="#8BB87A">     WELCOME TO ATM SIM</text>
  <text x="338" y="128" class="mono" font-size="9" fill="#8BB87A">============================</text>
  <text x="338" y="144" class="mono" font-size="9" fill="#3a5a3a">Enter Account ID: </text>
  <text x="437" y="144" class="mono" font-size="9" fill="#d4d4d4">ACC001</text>
  <text x="338" y="158" class="mono" font-size="9" fill="#3a5a3a">Enter PIN: </text>
  <text x="395" y="158" class="mono" font-size="9" fill="#d4d4d4">****</text>
  <text x="338" y="174" class="mono" font-size="9" fill="#C8C87A">Login successful.</text>
  <text x="338" y="190" class="mono" font-size="9" fill="#3a5a3a">Current balance: </text>
  <text x="430" y="190" class="mono" font-size="9" fill="#8BB87A">$2,450.00</text>
  <text x="338" y="206" class="mono" font-size="9" fill="#3a3a3a">1. Check Balance</text>
  <text x="338" y="218" class="mono" font-size="9" fill="#3a3a3a">2. Deposit</text>
  <text x="338" y="230" class="mono" font-size="9" fill="#3a3a3a">3. Withdraw</text>
  <text x="338" y="242" class="mono" font-size="9" fill="#3a3a3a">4. Transfer</text>
  <text x="338" y="254" class="mono" font-size="9" fill="#3a3a3a">5. Logout</text>
  <text x="338" y="268" class="mono" font-size="9" fill="#3a5a3a">Select option: </text>
  <text x="418" y="268" class="mono" font-size="9" fill="#C8C87A">_</text>

  <!-- operations row -->
  <rect x="331" y="292" width="70" height="42" rx="3" fill="#141414" stroke="#8BB87A" stroke-width="0.7"/>
  <text x="366" y="308" class="mono" font-size="8" fill="#8BB87A" text-anchor="middle">Deposit</text>
  <text x="366" y="320" class="mono" font-size="7" fill="#2a4a2a" text-anchor="middle">+ balance</text>
  <text x="366" y="328" class="mono" font-size="6" fill="#2a3a2a" text-anchor="middle">write to file</text>

  <rect x="407" y="292" width="70" height="42" rx="3" fill="#141414" stroke="#C4836A" stroke-width="0.7"/>
  <text x="442" y="308" class="mono" font-size="8" fill="#C4836A" text-anchor="middle">Withdraw</text>
  <text x="442" y="320" class="mono" font-size="7" fill="#5a3a2a" text-anchor="middle">- balance</text>
  <text x="442" y="328" class="mono" font-size="6" fill="#4a2a2a" text-anchor="middle">validate funds</text>

  <rect x="483" y="292" width="70" height="42" rx="3" fill="#141414" stroke="#5BAADC" stroke-width="0.7"/>
  <text x="518" y="308" class="mono" font-size="8" fill="#5BAADC" text-anchor="middle">Transfer</text>
  <text x="518" y="320" class="mono" font-size="7" fill="#2a3a5a" text-anchor="middle">acct → acct</text>
  <text x="518" y="328" class="mono" font-size="6" fill="#1a2a4a" text-anchor="middle">debit &amp; credit</text>

  <rect x="558" y="292" width="72" height="42" rx="3" fill="#141414" stroke="#B87DB8" stroke-width="0.7"/>
  <text x="594" y="308" class="mono" font-size="8" fill="#B87DB8" text-anchor="middle">File I/O</text>
  <text x="594" y="320" class="mono" font-size="7" fill="#4a2a5a" text-anchor="middle">persist state</text>
  <text x="594" y="328" class="mono" font-size="6" fill="#3a2a4a" text-anchor="middle">survives restart</text>

  <!-- code snippet -->
  <text x="64" y="320" class="mono" font-size="10" fill="#2a3a2a">public void</text>
  <text x="136" y="320" class="mono" font-size="10" fill="#8BB87A"> withdraw</text>
  <text x="183" y="320" class="mono" font-size="10" fill="#d4d4d4">(double amount) {</text>
  <text x="74" y="336" class="mono" font-size="10" fill="#4A72B0">  if</text>
  <text x="92" y="336" class="mono" font-size="10" fill="#d4d4d4"> (balance >= amount) balance -= amount</text>
  <text x="74" y="352" class="mono" font-size="10" fill="#4A72B0">  else</text>
  <text x="108" y="352" class="mono" font-size="10" fill="#d4d4d4"> throw </text>
  <text x="149" y="352" class="mono" font-size="10" fill="#C4836A">InsufficientFundsException</text>
  <text x="64" y="368" class="mono" font-size="10" fill="#d4d4d4">}</text>
</svg>
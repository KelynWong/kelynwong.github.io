<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 383" xmlns="http://www.w3.org/2000/svg">
  <style>.m{font-family:'JetBrains Mono','Courier New',monospace}</style>
  <rect width="680" height="383" fill="#0d0d0d"/>
  <defs><pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#1a1a1a" stroke-width="0.5"/></pattern></defs>
  <rect width="680" height="383" fill="url(#gr)"/>
  <rect x="0" y="0" width="680" height="36" fill="#141414"/>
  <rect x="0" y="35" width="680" height="1" fill="#2a2a2a"/>
  <circle cx="72" cy="18" r="5" fill="#C4836A"/><circle cx="90" cy="18" r="5" fill="#C8C87A"/><circle cx="108" cy="18" r="5" fill="#8BB87A"/>
  <text x="136" y="23" class="m" font-size="11" fill="#3a3a3a">ecoexchange_routes.js</text>
  <line x1="52" y1="36" x2="52" y2="383" stroke="#1e1e1e" stroke-width="1"/>
  <text x="64" y="74" class="m" font-size="11" fill="#3a3a3a">// project</text>
  <text x="64" y="98" class="m" font-size="20" font-weight="500" fill="#ffffff">EcoExchange</text>
  <text x="64" y="122" class="m" font-size="20" font-weight="500" fill="#8BB87A">E-Waste Collection Platform</text>
    <!-- recycling symbol (3 arrows in triangle) -->
  <g opacity="0.8">
    <path d="M170 230 L155 255 L185 255 Z" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M170 230 L155 205 L185 205 Z" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linejoin="round" transform="rotate(120 170 230)"/>
    <path d="M170 230 L155 205 L185 205 Z" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linejoin="round" transform="rotate(240 170 230)"/>
  </g>
  <!-- cleaner recycling icon using paths -->
  <circle cx="170" cy="222" r="52" fill="none" stroke="#1a2a1a" stroke-width="1"/>
  <circle cx="170" cy="222" r="42" fill="#0f1a0f"/>
  <!-- Arrow 1: top -->
  <path d="M170 185 L158 202 L166 202 L166 218 L174 218 L174 202 L182 202 Z" fill="#8BB87A" opacity="0.8"/>
  <!-- Arrow 2: bottom-left -->
  <path d="M170 185 L158 202 L166 202 L166 218 L174 218 L174 202 L182 202 Z" fill="#8BB87A" opacity="0.8" transform="rotate(120 170 222)"/>
  <!-- Arrow 3: bottom-right -->
  <path d="M170 185 L158 202 L166 202 L166 218 L174 218 L174 202 L182 202 Z" fill="#8BB87A" opacity="0.8" transform="rotate(240 170 222)"/>
  <!-- centre -->
  <circle cx="170" cy="222" r="10" fill="#0f1a0f" stroke="#8BB87A" stroke-width="0.8"/>
  <text x="170" y="227" class="m" font-size="15" fill="#8BB87A" text-anchor="middle">♻</text>

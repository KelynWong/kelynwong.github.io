  <path d="M138 170 L138 185 M138 170 L153 170" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M242 170 L242 185 M242 170 L227 170" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M138 274 L138 259 M138 274 L153 274" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M242 274 L242 259 M242 274 L227 274" fill="none" stroke="#8BB87A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- status pill -->
  <rect x="148" y="282" width="84" height="22" rx="3" fill="#0f2a18" stroke="#8BB87A" stroke-width="1"/>
  <circle cx="163" cy="293" r="3" fill="#8BB87A"/>
  <text x="173" y="297" class="m" font-size="10" fill="#8BB87A">COLLECTION BOOKED</text>
  <!-- user flow steps -->
  <rect x="290" y="148" width="96" height="36" rx="4" fill="#141414" stroke="#5BAADC" stroke-width="0.8"/>
  <text x="338" y="163" class="m" font-size="10" fill="#5BAADC" text-anchor="middle">Schedule</text>
  <text x="338" y="176" class="m" font-size="9" fill="#2a3a5a" text-anchor="middle">book pickup</text>
  <line x1="338" y1="184" x2="338" y2="202" stroke="#333" stroke-width="0.8"/>
  <rect x="290" y="202" width="96" height="36" rx="4" fill="#141414" stroke="#C8C87A" stroke-width="0.8"/>
  <text x="338" y="217" class="m" font-size="10" fill="#C8C87A" text-anchor="middle">Track History</text>
  <text x="338" y="230" class="m" font-size="9" fill="#4a4a2a" text-anchor="middle">recycling log</text>
  <line x1="338" y1="238" x2="338" y2="256" stroke="#333" stroke-width="0.8"/>
  <rect x="290" y="256" width="96" height="36" rx="4" fill="#141414" stroke="#8BB87A" stroke-width="0.8"/>
  <text x="338" y="271" class="m" font-size="10" fill="#8BB87A" text-anchor="middle">Impact Report</text>
  <text x="338" y="284" class="m" font-size="9" fill="#2a4a2a" text-anchor="middle">sustainability data</text>
  <line x1="338" y1="292" x2="338" y2="310" stroke="#333" stroke-width="0.8"/>
  <rect x="290" y="310" width="96" height="36" rx="4" fill="#141414" stroke="#B87DB8" stroke-width="0.8"/>
  <text x="338" y="325" class="m" font-size="10" fill="#B87DB8" text-anchor="middle">Figma Prototype</text>
  <text x="338" y="338" class="m" font-size="9" fill="#4a2a5a" text-anchor="middle">UX validated</text>
  <!-- tech stack right -->
  <rect x="412" y="148" width="90" height="36" rx="4" fill="#141414" stroke="#C8C87A" stroke-width="0.8"/>
  <text x="457" y="163" class="m" font-size="10" fill="#C8C87A" text-anchor="middle">HTML / CSS / JS</text>
  <text x="457" y="176" class="m" font-size="9" fill="#4a4a2a" text-anchor="middle">vanilla frontend</text>
  <line x1="457" y1="184" x2="457" y2="202" stroke="#333" stroke-width="0.8"/>
  <rect x="412" y="202" width="90" height="36" rx="4" fill="#141414" stroke="#8BB87A" stroke-width="0.8"/>
  <text x="457" y="217" class="m" font-size="10" fill="#8BB87A" text-anchor="middle">Node + Express</text>
  <text x="457" y="230" class="m" font-size="9" fill="#2a4a2a" text-anchor="middle">REST API</text>
  <line x1="457" y1="238" x2="457" y2="256" stroke="#333" stroke-width="0.8"/>
  <rect x="412" y="256" width="90" height="36" rx="4" fill="#141414" stroke="#5BAADC" stroke-width="0.8"/>
  <text x="457" y="271" class="m" font-size="10" fill="#5BAADC" text-anchor="middle">MySQL</text>
  <text x="457" y="284" class="m" font-size="9" fill="#2a3a5a" text-anchor="middle">database</text>
  <!-- impact stat mockup -->
  <rect x="520" y="148" width="130" height="80" rx="4" fill="#0f1a0f" stroke="#8BB87A" stroke-width="0.8"/>
  <text x="585" y="165" class="m" font-size="9" fill="#8BB87A" text-anchor="middle">impact_report.js</text>
  <line x1="526" y1="171" x2="644" y2="171" stroke="#1a2a1a" stroke-width="0.6"/>
  <text x="534" y="186" class="m" font-size="9" fill="#555">devices recycled</text>
  <text x="630" y="186" class="m" font-size="11" fill="#8BB87A" text-anchor="end">247</text>
  <text x="534" y="202" class="m" font-size="9" fill="#555">CO₂ saved (kg)</text>
  <text x="630" y="202" class="m" font-size="11" fill="#C8C87A" text-anchor="end">1,840</text>
  <text x="534" y="218" class="m" font-size="9" fill="#555">active users</text>
  <text x="630" y="218" class="m" font-size="11" fill="#5BAADC" text-anchor="end">89</text>
  <!-- code -->
  <text x="64" y="344" class="m" font-size="10" fill="#2a3a2a">app.post(</text>
  <text x="113" y="344" class="m" font-size="10" fill="#C8C87A">'/api/collection'</text>
  <text x="231" y="344" class="m" font-size="10" fill="#d4d4d4">, async (req, res) => {</text>
  <text x="64" y="360" class="m" font-size="10" fill="#4A72B0">  await</text>
  <text x="101" y="360" class="m" font-size="10" fill="#d4d4d4"> db.schedule(req.body)</text>
  <text x="64" y="376" class="m" font-size="10" fill="#d4d4d4">})</text>
</svg>
